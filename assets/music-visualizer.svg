<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 48" width="500" height="48">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Headphones Icon -->
  <g transform="translate(18, 14)" fill="#38bdf8">
    <path d="M12 1a9 9 0 0 0-9 9v7c0 1.66 1.34 3 3 3h1a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2H5v-1a7 7 0 0 1 14 0v1h-2a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h1c1.66 0 3-1.34 3-3v-7a9 9 0 0 0-9-9z"/>
  </g>

  <!-- Track Title -->
  <text x="50" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">
    Lofi Beats &amp; Synthwave Code Flow
  </text>
  <text x="50" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10">
    🎧 Satwik's Deep Focus Session &bull; Lo-Fi Chill Hop
  </text>

  <!-- Animated Equalizer Bars -->
  <g transform="translate(420, 24) scale(1, -1)">
    <!-- Bar 1 -->
    <rect x="0" y="0" width="4" height="12" rx="2" fill="url(#eqGrad)">
      <animate attributeName="height" values="6;22;10;26;8;18;6" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 2 -->
    <rect x="8" y="0" width="4" height="18" rx="2" fill="url(#eqGrad)">
      <animate attributeName="height" values="18;8;26;12;24;6;18" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 3 -->
    <rect x="16" y="0" width="4" height="24" rx="2" fill="url(#eqGrad)">
      <animate attributeName="height" values="12;26;14;8;22;26;12" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 4 -->
    <rect x="24" y="0" width="4" height="10" rx="2" fill="url(#eqGrad)">
      <animate attributeName="height" values="24;10;20;26;14;8;24" dur="1.0s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 5 -->
    <rect x="32" y="0" width="4" height="16" rx="2" fill="url(#eqGrad)">
      <animate attributeName="height" values="8;20;6;24;16;12;8" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 6 -->
    <rect x="40" y="0" width="4" height="20" rx="2" fill="url(#eqGrad)">
      <animate attributeName="height" values="16;6;24;10;22;18;16" dur="0.95s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
